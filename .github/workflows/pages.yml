name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# no workflow-level permissions: test/ui need none, build needs only the
# default read, and the deploy job scopes pages: write + id-token: write
# to itself (job-level permissions: below) — the token surface for the
# jobs that run on every PR stays at the default minimum.

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  ui:
    # Runs with the same triggers as `test` (no if: gate). The UI suite
    # (test/ui/*.test.mjs) drives Playwright, which the `test` job
    # intentionally does NOT install — there the UI tests self-skip,
    # keeping that job fast and the merge gate cheap. This job provides
    # the real browser run; both jobs gate merges. The ~2-4 min browser
    # install is isolated here so PR feedback on the unit job stays fast.
    runs-on: ubuntu-latest
    # the skip path in test/ui/harness.mjs hard-fails (instead of
    # self-skipping) under CI + PLAYWRIGHT_REQUIRED: a skip would silently
    # no-op this job's browser gate.
    env:
      PLAYWRIGHT_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g playwright@1.61.1
      # --package pins the CLI (and hence the browser revision) to the same
      # 1.61.1 as the global install, so PATH lookup of the global CLI can
      # never silently swap the browser revision
      - run: npx --package=playwright@1.61.1 playwright install --with-deps chromium
      - run: npm test

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Actions use major-version tags rather than full-SHA pins (the stronger
    # option for deploy workflows). The suite is zero-dependency, so a tag
    # bump can only change the runner toolchain, not the build inputs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
