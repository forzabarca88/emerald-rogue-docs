name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# no workflow-level permissions: test/ui need none, build needs only the
# default read, and the deploy job scopes pages: write + id-token: write
# to itself (job-level permissions: below) — the token surface for the
# jobs that run on every PR stays at the default minimum.

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  ui:
    # Runs with the same triggers as `test` (no if: gate). The UI suite
    # (test/ui/*.test.mjs) drives Playwright, which the `test` job
    # intentionally does NOT install — there the UI tests self-skip,
    # keeping that job fast and the merge gate cheap. This job provides
    # the real browser run; both jobs gate merges. The ~2-4 min browser
    # install is isolated here so PR feedback on the unit job stays fast.
    runs-on: ubuntu-latest
    # the skip path in test/ui/harness.mjs hard-fails (instead of
    # self-skipping) under CI + PLAYWRIGHT_REQUIRED: a skip would silently
    # no-op this job's browser gate.
    env:
      PLAYWRIGHT_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g playwright@1.61.1
      # --package pins the CLI (and hence the browser revision) to the same
      # 1.61.1 as the global install, so PATH lookup of the global CLI can
      # never silently swap the browser revision
      - run: npx --package=playwright@1.61.1 playwright install --with-deps chromium
      - run: npm test

  verify:
    # Merge gate for citation accuracy (issue #55): the verifier
    # (scripts/verify/citations.mjs) reads the vendored game repo, which is
    # gitignored and never committed — this job builds it at run time at the
    # two baseline SHAs from scripts/verify/baseline.json. A depth-1 clone
    # (the game repo's default branch is vanilla = the vanilla baseline)
    # plus a depth-1 fetch of both baseline SHAs: the verifier reads full
    # file contents from the vanilla working tree and from origin/expansion
    # via git cat-file, so a partial/blobless fetch is not viable. Failure
    # semantics: GATE — a stale citation, or a baseline SHA upstream no
    # longer serves (which means the baseline must be re-cut and the docs
    # re-baselined), fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Clone the game repo at the two baseline SHAs
        run: |
          set -euo pipefail
          # SHAs from scripts/verify/baseline.json, upstream URL from
          # data/site.json citations.repo (the single source for both).
          GAME_REPO="$(node -p 'JSON.parse(require("fs").readFileSync("data/site.json","utf8")).citations.repo').git"
          VANILLA_SHA="$(node -p 'JSON.parse(require("fs").readFileSync("scripts/verify/baseline.json","utf8")).vanilla.sha')"
          EXPANSION_SHA="$(node -p 'JSON.parse(require("fs").readFileSync("scripts/verify/baseline.json","utf8")).expansion.sha')"
          git clone --depth 1 "$GAME_REPO" references/pokeemerald-rogue
          git -C references/pokeemerald-rogue fetch --depth 1 origin "$VANILLA_SHA" "$EXPANSION_SHA"
          # The ref layout the verifier expects (assertRepoSane): the
          # working tree on branch "vanilla" at the vanilla baseline, and
          # origin/expansion resolving to the expansion baseline.
          git -C references/pokeemerald-rogue checkout -B vanilla "$VANILLA_SHA"
          git -C references/pokeemerald-rogue update-ref refs/remotes/origin/expansion "$EXPANSION_SHA"
          echo "vanilla:   $(git -C references/pokeemerald-rogue rev-parse HEAD)"
          echo "expansion: $(git -C references/pokeemerald-rogue rev-parse origin/expansion)"
      - run: npm run verify:citations

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Actions use major-version tags rather than full-SHA pins (the stronger
    # option for deploy workflows). The suite is zero-dependency, so a tag
    # bump can only change the runner toolchain, not the build inputs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
